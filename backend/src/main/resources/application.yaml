spring:
  application:
    name: sharelist
  # Override with SPRING_DATASOURCE_URL/USERNAME/PASSWORD, or a single DATABASE_URL
  # (postgres://user:password@host:5432/db) as hosting platforms provide it.
  datasource:
    url: jdbc:postgresql://localhost:5432/sharelist
    username: sharelist
    password: sharelist
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
  threads:
    virtual:
      enabled: true
  mvc:
    problemdetails:
      enabled: true
  lifecycle:
    timeout-per-shutdown-phase: 10s

server:
  # Hosting platforms such as Render tell the app which port to listen on.
  port: ${PORT:8080}
  shutdown: graceful
  # Respect X-Forwarded-* headers when running behind a reverse proxy / load balancer.
  forward-headers-strategy: framework
  compression:
    enabled: true
    mime-types: application/json,text/html,text/css,application/javascript,image/svg+xml

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

app:
  limits:
    max-items-per-list: 200
    max-participants-per-list: 500
  realtime:
    # Clients reconnect automatically when a stream times out.
    emitter-timeout: 15m
    heartbeat-interval: 20s
    max-subscribers-per-list: 2000
  retention:
    enabled: true
    # Lists with no activity for this long are deleted.
    delete-inactive-after: 180d
  cors:
    # Only needed when the frontend is served from a different origin than the API.
    allowed-origins: []
